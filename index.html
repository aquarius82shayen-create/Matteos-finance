<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />

  <title>Matteo's Finance</title>
  <style>:root{
  --bg:#050b18;--panel:#091425;--panel2:#0b1629;--line:#183858;--text:#edf4ff;--muted:#aeb8ca;

*{box-sizing:border-box} html,body{margin:0;background:#020611;color:var(--text);font-family:var(--font)}
body{min-height:100vh}.app-shell{max-width:720px;margin:auto;min-height:100vh;background:radial-gradient(circle at 50% -10%,#17103b 0,#070c1a 44%,#050914 100%);padding-bottom:96px;overflow:hidden}
.app{padding:14px 14px 34px}.page{display:none;animation:fade .2s ease}.page.active{display:block}@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}
/* Header definitivo: ordinato, senza slogan e senza elementi sovrapposti */
.hero{position:relative;min-height:430px;border:1px solid #22557d;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 78% 22%,rgba(92,30,150,.22),transparent 32%),linear-gradient(135deg,#030817 0%,#07101f 58%,#090d25 100%);box-shadow:var(--shadow)}

.hero-actions{position:absolute;right:18px;top:16px;z-index:5;display:flex;gap:10px}.icon-btn{width:48px;height:48px;border-radius:50%;border:1px solid #8c39ff;background:#07101ee8;color:white;font-size:20px;cursor:pointer;box-shadow:0 0 20px rgba(140,57,255,.18)}

.balance-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.big-btn,.primary-btn,.secondary-btn,.danger-btn{border:1px solid #25405d;border-radius:15px;padding:14px 16px;font-weight:800;color:#fff;background:#101c2f;cursor:pointer;font-size:15px}.big-btn.income{border-color:#0ca86a;background:linear-gradient(90deg,#063829,#08271f)}.big-btn.expense{border-color:#bc135a;background:linear-gradient(90deg,#30101f,#2a0716)}.primary-btn{background:linear-gradient(135deg,#9b39ff,#5d1fe0);border-color:#a95cff}.danger-btn{background:#34121c;border-color:#9b2646}.secondary-btn{background:#101b2b}
.section{margin-top:14px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 6px 10px;font-size:19px;font-weight:900;letter-spacing:.3px}.panel{background:linear-gradient(135deg,rgba(10,21,39,.96),rgba(5,13,26,.94));border:1px solid #193858;border-radius:20px;box-shadow:var(--shadow)}
.week-panel{padding:14px}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day-card{min-height:132px;border:1px solid #174567;border-radius:16px;padding:10px 5px;text-align:center;background:linear-gradient(180deg,#0a1527,#081322)}.day-card.today{border-color:#9b39ff;box-shadow:0 0 18px rgba(140,57,255,.45),inset 0 0 20px rgba(140,57,255,.12)}.day-name{font-size:11px;font-weight:800;color:#d3dae5}.day-num{font-size:27px;font-weight:900;margin:2px 0 8px}.day-in,.day-out{font-size:11px;font-weight:800;white-space:nowrap}.day-plus{margin-top:8px;border:1px solid #214b68;background:#0d2031;color:#fff;border-radius:50%;width:30px;height:30px;font-size:19px;cursor:pointer}

.chart-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;margin-top:12px}.legend{list-style:none;padding:0;margin:0}.legend li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;padding:4px 0;color:#d8dfeb;font-size:14px}.dot{width:10px;height:10px;border-radius:50%}.donut{width:190px;height:190px;border-radius:50%;margin:auto;background:conic-gradient(#7a21ff 0 40%,#ff1675 40% 60%,#159fff 60% 75%,#29e88b 75% 90%,#ffd34f 90% 100%);position:relative;box-shadow:0 0 26px rgba(140,57,255,.2)}.donut:after{content:"";position:absolute;inset:27%;background:#08111f;border-radius:50%;box-shadow:inset 0 0 0 1px #172b43}.donut-center{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-weight:900}.donut-center small{color:#c9d2e0;font-weight:500}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);height:84px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;background:rgba(3,8,18,.95);backdrop-filter:blur(18px);border-top:1px solid #173553;z-index:20}.nav-item{height:62px;border:0;background:transparent;color:#aab5c7;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;cursor:pointer;font-size:24px}.nav-item small{font-size:12px}.nav-item.active{color:#47ee9a}.quick-add{width:68px;height:68px;border-radius:50%;border:1px solid #d36cff;background:radial-gradient(circle at 35% 30%,#b969ff,#7020d8 62%,#451196);color:white;font-size:42px;line-height:1;box-shadow:0 0 24px rgba(140,57,255,.6);cursor:pointer;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.page-head h1{margin:0;font-size:30px}
.month-control{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0}.month-control button{border:1px solid #20415f;background:#0a1526;color:white;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}.month-control select{flex:1;max-width:320px;background:#0b1628;border:1px solid #31516e;color:white;border-radius:14px;padding:12px;font-weight:800;text-align:center}
.forecast-card{padding:16px}.forecast-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #152a42}.forecast-row:last-child{border-bottom:0}.forecast-note{margin-top:12px;padding:12px;border:1px solid #174f85;background:#08192e;border-radius:12px;color:#c7d8ef;font-size:13px}.events-list{display:grid;gap:10px}.event-row,.movement-row{padding:14px;border:1px solid #193a58;border-radius:16px;background:#081424;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}.event-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#10253a;font-size:23px}.event-meta b{display:block}.event-meta small{color:var(--muted)}.event-actions{display:flex;gap:8px}.mini-btn{border:0;background:#102036;color:#d7e1ee;border-radius:9px;padding:8px;cursor:pointer}.mini-btn.delete{color:#ff5c78}
.bar-chart{height:220px;padding:20px;display:flex;align-items:flex-end;gap:14px;border-top:1px solid #172c46;margin-top:12px}.bar{flex:1;min-height:20px;border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,#38e4aa,#176f69);position:relative}.bar span{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);font-size:11px;color:#aeb8ca}
.goal-tabs{display:flex;gap:8px;margin-bottom:12px}.goal-tabs button{flex:1;border:1px solid #193b58;background:#0a1627;color:#b8c2d0;padding:11px;border-radius:12px;cursor:pointer}.goal-tabs .active{color:white;background:#11243a}.goals-list{display:grid;gap:12px}.goal-card{padding:15px;border:1px solid #214d71;border-radius:18px;background:linear-gradient(135deg,#081725,#071221)}.goal-top{display:flex;justify-content:space-between;gap:10px}.goal-card h3{margin:0 0 4px}.goal-card p{margin:0;color:var(--muted);font-size:13px}.status{padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;height:max-content}.status.good{background:#123c28;color:#62f5a7}.status.watch{background:#4b3b10;color:#ffe170}.status.bad{background:#4c1722;color:#ff8192}.progress{height:9px;background:#172435;border-radius:999px;margin:14px 0 7px;overflow:hidden}.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#27e28b,#8bff7a)}.goal-foot{display:flex;justify-content:space-between;color:#b9c5d3;font-size:13px}
.filters{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.filter-btn{white-space:nowrap;border:1px solid #1b3956;background:#091626;color:#c8d3df;padding:9px 12px;border-radius:999px;cursor:pointer}.filter-btn.active{border-color:#39d995;color:#39d995}.movement-list{display:grid;gap:9px}.movement-amount{font-weight:900}.empty{padding:32px 16px;text-align:center;color:#a9b6c7;border:1px dashed #25445e;border-radius:18px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:grid;align-items:end}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0c1729,#070d18);border:1px solid #244664;border-radius:26px 26px 0 0;padding:18px;box-shadow:0 -20px 50px rgba(0,0,0,.45)}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close-btn{border:0;background:transparent;color:#dbe6f5;font-size:28px;cursor:pointer}.form-grid{display:grid;gap:12px;margin-top:16px}.form-grid.two{grid-template-columns:1fr 1fr}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:800;color:#cbd5e1}.field input,.field select,.field textarea{width:100%;background:#0b1728;border:1px solid #2a4661;border-radius:12px;color:white;padding:13px;font:inherit}.field textarea{min-height:74px}.type-switch,.priority-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.priority-switch{grid-template-columns:repeat(3,1fr)}.type-switch button,.priority-switch button{padding:13px;border-radius:12px;border:1px solid #2a4661;background:#0b1728;color:#cbd5e1;cursor:pointer;font-weight:800}.type-switch .income.active{border-color:#21d783;color:#6ff7ae;background:#0d2b20}.type-switch .expense.active{border-color:#d61a68;color:#ff8ab5;background:#35101e}.priority-switch button.active{border-color:#a06cff;background:#2a1645;color:white}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions button{flex:1}.analysis-box{padding:14px;border:1px solid #1f4461;border-radius:14px;background:#091727}.analysis-box.good{border-color:#258452;background:#0d2d1f}.analysis-box.watch{border-color:#9b7b25;background:#2d2710}.analysis-box.bad{border-color:#8b3144;background:#32131b}
@media(max-width:520px){.hero{min-height:390px}.brand{left:39%;top:26px}.brand .matteo{font-size:29px}.brand .finance{font-size:46px}.duck-art{width:49%;max-height:235px}.wallet-art{top:128px;width:56%;height:170px;opacity:.62}.month-select{top:94px;right:14px;font-size:12px;max-width:150px}.hero-actions{right:14px;top:14px}.balance-card{padding:16px}.balance-value{font-size:50px}.week-grid{gap:5px}.day-card{min-height:114px;padding:8px 2px}.day-name{font-size:9px}.day-num{font-size:24px}.day-in,.day-out{font-size:9px}.stats-grid{grid-template-columns:1fr}.chart-panel{grid-template-columns:1fr}.donut{width:210px;height:210px}.form-grid.two{grid-template-columns:1fr}.bottom-nav{height:78px;grid-template-columns:1fr 1fr 68px 1fr 1fr}.quick-add{width:62px;height:62px}.nav-item{font-size:20px}.balance-buttons{grid-template-columns:1fr 1fr}.big-btn{padding:13px 8px;font-size:14px}}

<body>
  <div class="app-shell">
    <main id="app" class="app"></main>
    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button data-nav="dashboard" class="nav-item active"><span>⌂</span><small>Dashboard</small></button>
      <button data-nav="movements" class="nav-item"><span>☷</span><small>Movimenti</small></button>
      <button id="quickAdd" class="quick-add" aria-label="Aggiungi movimento">＋</button>
      <button data-nav="forecasts" class="nav-item"><span>▣</span><small>Previsioni</small></button>

    </nav>

  <div id="modalRoot"></div>
  <script>const € = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
const state = JSON.parse(localStorage.getItem('matteos-finance-v1') || 'null') || {
  page:'dashboard',
  balance:3245.60,
  transactions:[
    {id:'t1',date:'2026-09-01',type:'income',category:'Stipendio',description:'Stipendio',amount:1870},
    {id:'t2',date:'2026-09-03',type:'expense',category:'Spesa',description:'Spesa alimentare',amount:649.76},
    {id:'t3',date:'2026-09-04',type:'expense',category:'Benzina',description:'Rifornimento',amount:324.88},
    {id:'t4',date:'2026-09-05',type:'expense',category:'Casa',description:'Spese casa',amount:243.66},
    {id:'t5',date:'2026-09-06',type:'expense',category:'Affitto',description:'Affitto',amount:243.66},
    {id:'t6',date:'2026-09-07',type:'expense',category:'Contrattempo',description:'Imprevisti',amount:81.22},
    {id:'t7',date:'2026-09-08',type:'expense',category:'Tempo libero',description:'Svago',amount:48.73},
    {id:'t8',date:'2026-09-09',type:'expense',category:'Altro',description:'Varie',amount:32.49}
  ],
  futureEvents:[
    {id:'e1',date:'2026-12-15',type:'expense',category:'Auto',description:'Assicurazione auto',amount:600},
    {id:'e2',date:'2026-12-18',type:'income',category:'Redditi',description:'Credito dichiarazione',amount:400}
  ],
  goals:[
    {id:'g1',name:'Chitarra nuova',cost:350,deadline:'2026-12-31',priority:'media',cushion:1000,saved:150},
    {id:'g2',name:'Vacanza Berlino',cost:1500,deadline:'2027-08-31',priority:'media',cushion:0,saved:300},
    {id:'g3',name:'Nuovo computer',cost:1200,deadline:'2027-04-30',priority:'alta',cushion:0,saved:100}
  ],
  forecastMonth:'2026-12',
  movementFilter:'all'
};
const categories=['Stipendio','Spesa','Benzina','Casa','Affitto','Contrattempo','Tempo libero','Altro','Auto','Redditi','Lavoro','Salute'];
function save(){localStorage.setItem('matteos-finance-v1',JSON.stringify(state))}
function uid(){return Math.random().toString(36).slice(2,10)}
function sum(items){return items.reduce((a,b)=>a+b,0)}
function monthOf(d){return d.slice(0,7)}
function currentMonth(){return '2026-09'}
function monthName(ym){return new Date(ym+'-01T12:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'})}
function monthTx(ym){return state.transactions.filter(t=>monthOf(t.date)===ym)}
function income(ym=currentMonth()){return sum(monthTx(ym).filter(t=>t.type==='income').map(t=>t.amount))}
function expenses(ym=currentMonth()){return sum(monthTx(ym).filter(t=>t.type==='expense').map(t=>t.amount))}
function savings(ym=currentMonth()){return income(ym)-expenses(ym)}
function prevMonth(ym){let [y,m]=ym.split('-').map(Number);m--;if(m===0){m=12;y--}return `${y}-${String(m).padStart(2,'0')}`}
function monthlyCapacity(){const allMonths=[...new Set(state.transactions.map(t=>monthOf(t.date)))];const values=allMonths.map(m=>Math.max(0,savings(m))).filter(Number.isFinite);return values.length?sum(values)/values.length:245.6}
function changePage(page){state.page=page;save();render()}
function dashboard(){const ym=currentMonth(), inc=income(ym), out=expenses(ym), sav=inc-out;const cats={};monthTx(ym).filter(t=>t.type==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);const totalOut=out||1;const colors=['#7a21ff','#ff1675','#ff6247','#29e88b','#ffd34f','#ffe08a','#a93de7'];const entries=Object.entries(cats);const days=[['LUN',3,120,45],['MAR',4,0,30],['MER',5,30,18],['GIO',6,0,65],['VEN',7,0,20],['SAB',8,80,0],['DOM',9,0,15]];

</section>`}
function donutGradient(entries,colors,total){if(!entries.length)return '#172435';let acc=0;const s=entries.map(([_,v],i)=>{const a=acc;acc+=v/total*100;return `${colors[i%colors.length]} ${a}% ${acc}%`}).join(',');return `conic-gradient(${s})`}
function forecasts(){const f=forecast(state.forecastMonth);return `<section class="page ${state.page==='forecasts'?'active':''}"><div class="page-head"><div><h1>Previsioni</h1></div><button class="icon-btn" onclick="openSettings()">⚙</button></div><div class="month-control"><button onclick="shiftForecast(-1)">‹</button><select onchange="state.forecastMonth=this.value;save();render()">${monthOptions().map(x=>`<option value="${x}" ${x===state.forecastMonth?'selected':''}>${monthName(x)}</option>`).join('')}</select><button onclick="shiftForecast(1)">›</button></div><div class="panel forecast-card"><h3 style="margin-top:0">Situazione prevista</h3><div class="forecast-row"><span>🟢 Entrate previste</span><b>${€ .format(f.income)}</b></div><div class="forecast-row"><span>🔴 Uscite previste</span><b>${€ .format(f.expenses)}</b></div><div class="forecast-row"><span>📉 Saldo mese</span><b class="${f.net>=0?'positive':'negative'}">${€ .format(f.net)}</b></div><div class="forecast-row"><span>🏦 Totale stimato fine mese</span><b class="positive">${€ .format(f.endBalance)}</b></div><div class="forecast-note">Queste previsioni applicano prudenzialmente <b>−5% alle entrate</b> e <b>+5% alle spese</b>, oltre agli eventi futuri che inserisci.</div></div><div class="section-title">Eventi futuri <button class="primary-btn" onclick="openFutureEvent()">＋ Aggiungi evento</button></div><div class="events-list">${futureEventsForMonth(state.forecastMonth).map(eventRow).join('')||'<div class="empty">Nessun evento previsto per questo mese.</div>'}</div><div class="panel" style="margin-top:14px;padding:16px"><h3 style="margin:0">Andamento previsto dei risparmi</h3><div class="bar-chart">${monthOptions().slice(0,6).map((m,i)=>{const x=forecast(m).endBalance;const h=Math.max(15,Math.min(100,x/5000*100));return `<div class="bar" style="height:${h}%"><span>${monthName(m).slice(0,3)}</span></div>`}).join('')}</div></div></section>`}
function monthOptions(){return ['2026-09','2026-10','2026-11','2026-12','2027-01','2027-02','2027-03','2027-04','2027-05','2027-06','2027-07','2027-08']}
function shiftForecast(n){const a=monthOptions(),i=a.indexOf(state.forecastMonth);state.forecastMonth=a[Math.max(0,Math.min(a.length-1,i+n))];save();render()}
function futureEventsForMonth(ym){return state.futureEvents.filter(e=>monthOf(e.date)===ym)}
function forecast(ym){const baseIncome=income(currentMonth())*.95;const baseExpenses=expenses(currentMonth())*1.05;const ev=futureEventsForMonth(ym);const ei=sum(ev.filter(e=>e.type==='income').map(e=>e.amount));const ee=sum(ev.filter(e=>e.type==='expense').map(e=>e.amount));const inc=baseIncome+ei,out=baseExpenses+ee,net=inc-out;const idx=monthOptions().indexOf(ym), baseIdx=monthOptions().indexOf(currentMonth());let running=state.balance;for(let i=baseIdx+1;i<=idx;i++){const m=monthOptions()[i];const events=futureEventsForMonth(m);running+=baseIncome+sum(events.filter(e=>e.type==='income').map(e=>e.amount))-baseExpenses-sum(events.filter(e=>e.type==='expense').map(e=>e.amount))}return {income:inc,expenses:out,net,endBalance:running}}
function eventRow(e){return `<div class="event-row"><div class="event-icon">${e.type==='income'?'▣':'▰'}</div><div class="event-meta"><b>${e.description}</b><small>${new Date(e.date+'T12:00').toLocaleDateString('it-IT')} · ${e.category}</small></div><div class="event-actions"><strong class="${e.type==='income'?'positive':'negative'}">${e.type==='income'?'+':'-'}${€ .format(e.amount)}</strong><button class="mini-btn delete" onclick="deleteFutureEvent('${e.id}')">⌫</button></div></div>`}
function goals(){return `<section class="page ${state.page==='goals'?'active':''}"><div class="page-head"><div><h1>Obiettivi</h1></div><button class="icon-btn" onclick="openSettings()">⚙</button></div><button class="primary-btn" style="width:100%;font-size:18px" onclick="openGoal()">＋ Nuovo obiettivo</button><div class="goal-tabs"><button class="active">In corso (${state.goals.length})</button><button>Completati (0)</button><button>Archiviati (0)</button></div><div class="goals-list">${state.goals.map(goalCard).join('')||'<div class="empty">Non hai ancora obiettivi.</div>'}</div></section>`}
function goalCard(g){const a=analyseGoal(g),pct=Math.min(100,g.saved/g.cost*100);return `<div class="goal-card"><div class="goal-top"><div><h3>${escapeHtml(g.name)}</h3><b class="positive">${€ .format(g.cost)}</b><p>Entro il ${new Date(g.deadline+'T12:00').toLocaleDateString('it-IT')}</p><p>Mancano ${a.monthsLeft} mesi · Priorità ${g.priority}</p></div><span class="status ${a.status}">${a.label}</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="goal-foot"><span>${€ .format(g.saved)}</span><span>${Math.round(pct)}%</span><span>${€ .format(g.cost)}</span></div><div style="margin-top:12px;display:flex;gap:8px"><button class="secondary-btn" style="flex:1" onclick="openGoalAnalysis('${g.id}')">Analizza</button><button class="danger-btn" onclick="deleteGoal('${g.id}')">⌫</button></div></div>`}
function analyseGoal(g){const now=new Date('2026-09-01T12:00'),end=new Date(g.deadline+'T12:00');let months=Math.max(1,(end.getFullYear()-now.getFullYear())*12+end.getMonth()-now.getMonth()+1);const needed=Math.max(0,(g.cost-g.saved)/months);const cap=Math.max(0,monthlyCapacity()-(g.cushion>state.balance?0:0));const ratio=cap?needed/cap:Infinity;let status='good',label='✓ In linea';if(ratio>.9&&ratio<=1.25){status='watch';label='⚠ Da monitorare'}if(ratio>1.25){status='bad';label='✕ Non raggiungibile'}return {monthsLeft:months,needed,capacity:cap,status,label,ratio}}
function movements(){const items=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).filter(t=>state.movementFilter==='all'||t.type===state.movementFilter);return `<section class="page ${state.page==='movements'?'active':''}"><div class="page-head"><div><h1>Movimenti</h1></div><button class="primary-btn" onclick="openTransaction()">＋</button></div><div class="filters"><button class="filter-btn ${state.movementFilter==='all'?'active':''}" onclick="setFilter('all')">Tutti</button><button class="filter-btn ${state.movementFilter==='income'?'active':''}" onclick="setFilter('income')">Entrate</button><button class="filter-btn ${state.movementFilter==='expense'?'active':''}" onclick="setFilter('expense')">Uscite</button></div><div class="movement-list">${items.map(t=>`<div class="movement-row"><div class="event-icon">${t.type==='income'?'↗':'↘'}</div><div class="event-meta"><b>${escapeHtml(t.description)}</b><small>${t.category} · ${new Date(t.date+'T12:00').toLocaleDateString('it-IT')}</small></div><div class="event-actions"><strong class="movement-amount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'-'}${€ .format(t.amount)}</strong><button class="mini-btn delete" onclick="deleteTransaction('${t.id}')">⌫</button></div></div>`).join('')||'<div class="empty">Nessun movimento.</div>'}</div></section>`}
function render(){document.getElementById('app').innerHTML=dashboard()+movements()+forecasts()+goals();document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>changePage(b.dataset.nav)));document.getElementById('quickAdd').onclick=()=>openTransaction();}
function setFilter(x){state.movementFilter=x;save();render()}
function openModal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openTransaction(defaultType='income'){let type=defaultType||'income';openModal(`<div class="modal-head"><h2>Nuovo movimento</h2><button class="close-btn" onclick="closeModal()">×</button></div><div class="type-switch"><button id="typeIncome" class="income active" onclick="selectType('income')">↓ Entrata</button><button id="typeExpense" class="expense" onclick="selectType('expense')">↑ Uscita</button></div><form id="transactionForm" class="form-grid"><div class="form-grid two"><div class="field"><label>Data</label><input name="date" type="date" value="2026-09-06" required></div><div class="field"><label>Categoria</label><select name="category">${categories.map(c=>`<option>${c}</option>`).join('')}</select></div></div><div class="field"><label>Descrizione</label><input name="description" placeholder="Es. Assicurazione auto" required></div><div class="field"><label>Importo</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="modal-actions"><button type="button" class="secondary-btn" onclick="closeModal()">Annulla</button><button class="primary-btn">Salva movimento</button></div></form>`);document.getElementById('transactionForm').dataset.type=type;document.getElementById('transactionForm').addEventListener('submit',submitTransaction)}
function selectType(type){const f=document.getElementById('transactionForm');f.dataset.type=type;document.getElementById('typeIncome').classList.toggle('active',type==='income');document.getElementById('typeExpense').classList.toggle('active',type==='expense')}
function submitTransaction(ev){ev.preventDefault();const f=ev.currentTarget,d=new FormData(f),amount=Number(d.get('amount'));state.transactions.push({id:uid(),date:d.get('date'),type:f.dataset.type,category:d.get('category'),description:d.get('description'),amount});state.balance+=f.dataset.type==='income'?amount:-amount;save();closeModal();render()}
function deleteTransaction(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;if(!confirm('Eliminare questo movimento?'))return;state.balance+=t.type==='income'?-t.amount:t.amount;state.transactions=state.transactions.filter(x=>x.id!==id);save();render()}
function openFutureEvent(){let type='expense';openModal(`<div class="modal-head"><h2>Nuovo evento previsto</h2><button class="close-btn" onclick="closeModal()">×</button></div><div class="type-switch"><button id="typeIncome" class="income" onclick="selectFutureType('income')">↓ Entrata</button><button id="typeExpense" class="expense active" onclick="selectFutureType('expense')">↑ Uscita</button></div><form id="futureForm" class="form-grid"><div class="form-grid two"><div class="field"><label>Data</label><input name="date" type="date" value="${state.forecastMonth}-15" required></div><div class="field"><label>Categoria</label><select name="category">${categories.map(c=>`<option>${c}</option>`).join('')}</select></div></div><div class="field"><label>Descrizione</label><input name="description" required></div><div class="field"><label>Importo</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="modal-actions"><button type="button" class="secondary-btn" onclick="closeModal()">Annulla</button><button class="primary-btn">Salva evento</button></div></form>`);document.getElementById('futureForm').dataset.type=type;document.getElementById('futureForm').addEventListener('submit',submitFuture)}
function selectFutureType(type){const f=document.getElementById('futureForm');f.dataset.type=type;document.getElementById('typeIncome').classList.toggle('active',type==='income');document.getElementById('typeExpense').classList.toggle('active',type==='expense')}
function submitFuture(ev){ev.preventDefault();const f=ev.currentTarget,d=new FormData(f);state.futureEvents.push({id:uid(),date:d.get('date'),type:f.dataset.type,category:d.get('category'),description:d.get('description'),amount:Number(d.get('amount'))});save();closeModal();render()}
function deleteFutureEvent(id){if(confirm('Eliminare questo evento previsto?')){state.futureEvents=state.futureEvents.filter(e=>e.id!==id);save();render()}}
function openGoal(){let priority='media', cushionEnabled=false;openModal(`<div class="modal-head"><h2>Nuovo obiettivo</h2><button class="close-btn" onclick="closeModal()">×</button></div><form id="goalForm" class="form-grid"><div class="field"><label>Quale meta vuoi raggiungere?</label><input name="name" placeholder="Es. Chitarra nuova" required></div><div class="field"><label>Quanto costa?</label><input name="cost" type="number" min="1" step="0.01" required></div><div class="field"><label>Entro quando?</label><input name="deadline" type="date" value="2026-12-31" required></div><div class="field"><label>Dai una priorità a questo obiettivo</label><div class="priority-switch"><button type="button" data-p="bassa">♧ Bassa</button><button type="button" data-p="media" class="active">◉ Media</button><button type="button" data-p="alta">♥ Alta</button></div></div><div class="field"><label>Vuoi fissare un minimo di cuscino?</label><div class="type-switch"><button type="button" id="cushionNo" class="active">No</button><button type="button" id="cushionYes">Sì</button></div></div><div id="cushionField" class="field" style="display:none"><label>Importo minimo del cuscino</label><input name="cushion" type="number" min="0" step="0.01" value="0"></div><div class="modal-actions"><button type="button" class="secondary-btn" onclick="closeModal()">Annulla</button><button class="primary-btn">Analizza obiettivo</button></div></form>`);document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{priority=b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('cushionNo').onclick=()=>{cushionEnabled=false;document.getElementById('cushionField').style.display='none';document.getElementById('cushionNo').classList.add('active');document.getElementById('cushionYes').classList.remove('active')};document.getElementById('cushionYes').onclick=()=>{cushionEnabled=true;document.getElementById('cushionField').style.display='block';document.getElementById('cushionYes').classList.add('active');document.getElementById('cushionNo').classList.remove('active')};document.getElementById('goalForm').addEventListener('submit',ev=>{ev.preventDefault();const d=new FormData(ev.currentTarget),g={id:uid(),name:d.get('name'),cost:Number(d.get('cost')),deadline:d.get('deadline'),priority,cushion:cushionEnabled?Number(d.get('cushion')):0,saved:0};state.goals.push(g);save();closeModal();openGoalAnalysis(g.id)})}
function openGoalAnalysis(id){const g=state.goals.find(x=>x.id===id);if(!g)return;const a=analyseGoal(g);openModal(`<div class="modal-head"><h2>Analisi obiettivo</h2><button class="close-btn" onclick="closeModal()">×</button></div><div class="analysis-box ${a.status}" style="margin-top:16px"><h3 style="margin-top:0">${escapeHtml(g.name)}</h3><div class="forecast-row"><span>Risparmio mensile necessario</span><b>${€ .format(a.needed)}</b></div><div class="forecast-row"><span>Capacità di risparmio stimata</span><b>${€ .format(a.capacity)}</b></div><div class="forecast-row"><span>Tempo disponibile</span><b>${a.monthsLeft} mesi</b></div><div class="forecast-row"><span>Cuscino considerato</span><b>${€ .format(g.cushion)}</b></div><h3>${a.label}</h3><p>${a.status==='good'?'Con l’andamento attuale puoi raggiungere l’obiettivo entro la data prevista.':a.status==='watch'?'L’obiettivo è vicino al limite: conviene monitorare spese e risparmio mensile.':'Con la capacità stimata attuale l’obiettivo non è raggiungibile entro la data prevista.'}</p></div><div class="modal-actions"><button class="primary-btn" onclick="closeModal();render()">Chiudi</button></div>`)}
function deleteGoal(id){if(confirm('Eliminare questo obiettivo?')){state.goals=state.goals.filter(g=>g.id!==id);save();render()}}
function openSettings(){openModal(`<div class="modal-head"><h2>Impostazioni</h2><button class="close-btn" onclick="closeModal()">×</button></div><div class="form-grid"><div class="analysis-box"><b>Dati salvati sul dispositivo</b><p>I movimenti, le previsioni e gli obiettivi rimangono salvati nel browser tramite memoria locale.</p></div><button class="danger-btn" onclick="resetDemo()">Ripristina dati demo</button></div>`)}
function resetDemo(){if(confirm('Ripristinare i dati iniziali?')){localStorage.removeItem('matteos-finance-v1');location.reload()}}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
render();
</script>
</body>
</html>
